<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Operação Máquina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  --bg:#E7ECEF; --panel:#F8FAFB; --panel2:#EEF2F4; --line:#C9D3DA;
  --ink:#15202A; --muted:#566775; --accent:#E7A100; --accent-ink:#1B1402;
  --steel:#2F5D7C; --ok:#1F8455; --ok-bg:#DDF1E6; --bad:#BF3F2B; --bad-bg:#F8E1DC;
  --gear:#5C6F7E; --gear2:#8FA2B1; --gear-out:#2F5D7C;
  --display:"Big Shoulders Display", "Arial Narrow", Impact, sans-serif;
  --body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0F151A; --panel:#172028; --panel2:#1D2831; --line:#2E3C47;
    --ink:#E2E9EF; --muted:#94A4B1; --accent:#F2B327; --accent-ink:#1B1402;
    --steel:#86B6D8; --ok:#52C68E; --ok-bg:#15322A; --bad:#F07A62; --bad-bg:#3A1F1A;
    --gear:#7E91A0; --gear2:#51636F; --gear-out:#86B6D8;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0F151A; --panel:#172028; --panel2:#1D2831; --line:#2E3C47;
  --ink:#E2E9EF; --muted:#94A4B1; --accent:#F2B327; --accent-ink:#1B1402;
  --steel:#86B6D8; --ok:#52C68E; --ok-bg:#15322A; --bad:#F07A62; --bad-bg:#3A1F1A;
  --gear:#7E91A0; --gear2:#51636F; --gear-out:#86B6D8;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:28px 28px;background-attachment:fixed;background-position:-1px -1px}
body::before{content:"";position:fixed;inset:0;background:var(--bg);opacity:.86;pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding-inline:16px;padding-block:14px 40px;display:flex;flex-direction:column;gap:14px}
h1,h2,h3{font-family:var(--display);text-transform:uppercase;letter-spacing:.02em;line-height:1;margin:0;text-wrap:balance}
p{margin:0}
button,input{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
svg text{font-family:var(--body)}

/* HUD */
.hud{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;background:#15202A;color:#E7ECEF;padding:10px 14px;border-radius:6px}
.brand{font-family:var(--display);font-weight:900;font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin-right:auto;line-height:1}
.brand span{color:var(--accent)}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:10px;letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.stat b{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums}
.stat b.code{color:var(--accent);letter-spacing:.12em}
.slots{display:flex;gap:6px}
.slot{width:34px;height:40px;border:2px dashed rgba(231,236,239,.45);border-radius:4px;display:grid;place-items:center;font-family:var(--mono);font-weight:700;font-size:20px;position:relative}
.slot::after{content:attr(data-s);position:absolute;top:-8px;left:3px;font-size:9px;font-family:var(--body);letter-spacing:.08em;background:#15202A;padding:0 2px;opacity:.75}
.slot.on{border-style:solid;border-color:#F2B327;color:#F2B327}
.hud .brand span,.stat b.code{color:#F2B327}

/* palco */
.stage{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:clamp(16px,3vw,26px);display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);font-weight:700}
.head{display:flex;flex-direction:column;gap:6px}
.head h2{font-size:clamp(30px,5vw,42px);font-weight:800}
.lede{color:var(--muted);max-width:64ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:2px solid var(--ink);background:transparent;padding:9px 16px;border-radius:5px;font-weight:700}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{border-color:var(--line);color:var(--muted);font-weight:600}
.btn.small{padding:6px 11px;font-size:13px}
.msg{border-left:4px solid var(--steel);background:var(--panel2);padding:10px 14px;border-radius:0 5px 5px 0}
.msg.ok{border-color:var(--ok);background:var(--ok-bg)}
.msg.bad{border-color:var(--bad);background:var(--bad-bg)}
.msg.hint{border-color:var(--accent)}
.msg.reveal{display:flow-root}
.digit-big{display:inline-grid;place-items:center;width:44px;height:52px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-weight:700;font-size:30px;border-radius:5px;margin-right:12px;float:left}
.situ{border:2px solid var(--ink);border-radius:6px;padding:10px 14px;background:var(--panel);display:flex;flex-direction:column;gap:4px}
.situ h3{font-size:19px}
.big-tag{display:inline-block;font-family:var(--display);font-weight:900;font-size:24px;letter-spacing:.04em;text-transform:uppercase;background:var(--ink);color:var(--accent);padding:2px 10px;border-radius:4px}

/* manual */
.manual{border:2px dashed var(--steel);border-radius:6px;background:var(--panel2);padding:0}
.manual > summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:10px;padding:10px 14px}
.manual > summary::-webkit-details-marker{display:none}
.manual > summary b{flex:1;min-width:0}
.manual > summary::after{flex:none;content:"mostrar";margin-left:auto;font-size:12px;color:var(--steel);font-weight:700;text-decoration:underline}
.manual[open] > summary::after{content:"esconder"}
.rule-tag{flex:none;font-family:var(--display);font-weight:800;text-transform:uppercase;letter-spacing:.06em;background:var(--steel);color:var(--panel);padding:2px 8px;border-radius:3px;font-size:15px}
.mbody{padding:0 14px 14px;display:flex;flex-direction:column;gap:8px;font-size:14.5px}
.mbody ol,.mbody ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:3px}
.mbody table{border-collapse:collapse;width:100%;font-size:13.5px}
.mbody th,.mbody td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
.mbody th{background:var(--panel);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mbody .tw{overflow-x:auto}
.mbody .note{font-size:13px;color:var(--muted)}
.mbody b{font-weight:700}
.sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;border:1px solid color-mix(in srgb,var(--ink) 30%,transparent);margin-right:4px}

/* início */
.intro{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;align-items:start}
.intro h2{font-size:clamp(40px,8vw,70px);font-weight:900;line-height:.92}
.intro h2 em{font-style:normal;color:var(--accent)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);border-radius:6px;background:var(--panel2);padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.mode b{font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em}
.mode small{color:var(--muted);font-size:13px;line-height:1.35}
.mode[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 30%,transparent);background:var(--panel)}
.codebox{display:flex;flex-wrap:wrap;gap:10px;align-items:center;border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:10px 12px}
.codebox .code{font-family:var(--mono);font-size:28px;font-weight:700;letter-spacing:.18em;color:var(--ink)}
.codein{font-family:var(--mono);font-size:20px;letter-spacing:.2em;text-transform:uppercase;width:7.2em;padding:6px 10px;border:2px solid var(--ink);border-radius:5px;background:var(--panel)}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.qrbox{background:#fff;padding:8px;border-radius:6px;display:inline-block;line-height:0}
.brief{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}

/* componentes dos minijogos */
.bench{background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px}
.bench svg{width:100%;height:auto;display:block;touch-action:manipulation}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:16px;align-items:start}
.col{display:flex;flex-direction:column;gap:10px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pick{border:2px solid var(--line);background:var(--panel2);border-radius:6px;padding:9px 10px;text-align:left;display:flex;flex-direction:column;gap:4px;font-weight:600;line-height:1.25;min-height:44px;position:relative}
.pick small{font-weight:500;color:var(--muted);font-size:12.5px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 28%,transparent)}
.pick.wrong{border-color:var(--bad)}
.pick.center{align-items:center;text-align:center;justify-content:center}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:2px solid var(--line);background:var(--panel2);border-radius:5px;padding:6px 10px;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.lbl{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.readout{font-family:var(--mono);font-weight:700;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.rchip{font-size:11.5px;font-weight:700;padding:1px 6px;border-radius:3px;background:var(--panel);border:1px solid var(--line);line-height:1.4}
.swatch{width:100%;height:40px;border-radius:4px;border:1px solid color-mix(in srgb,var(--ink) 20%,transparent)}
.bigsw{width:120px;height:90px;border-radius:8px;border:2px solid var(--ink)}
.bin{border:2px solid var(--ink);border-radius:6px 6px 10px 10px;padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:12px;min-height:64px;justify-content:flex-end;color:#fff;text-shadow:0 1px 2px #0008}
.bin span{font-family:var(--mono);font-size:11px}
.item{display:flex;align-items:center;gap:8px}
.item .dot{width:14px;height:14px;border-radius:50%;border:2px dashed var(--muted);flex:none}
.cell{cursor:pointer;-webkit-tap-highlight-color:transparent;outline:none}
svg *{-webkit-tap-highlight-color:transparent}
.gauges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.gauge{border:1px solid var(--line);border-radius:6px;background:var(--panel2);padding:8px 10px;display:flex;gap:10px;align-items:center}
.gauge svg{flex:none}
.gauge b{display:block;font-size:15px}
.badge{cursor:pointer;outline:none}
.badge.fixed{cursor:default}
.badge.wrong circle.face{stroke:var(--bad);stroke-width:4;fill:var(--bad-bg)}
.badge.right circle.face{stroke:var(--ok);stroke-width:3}

/* cadeado e final */
.lock{display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center;padding-block:10px}
.dials{display:flex;gap:12px}
.dial{display:flex;flex-direction:column;align-items:center;gap:4px}
.dial button{width:56px;border:2px solid var(--ink);background:var(--panel2);border-radius:5px;font-weight:700;line-height:1.6}
.dial output{width:56px;height:70px;display:grid;place-items:center;font-family:var(--mono);font-size:38px;font-weight:700;background:var(--ink);color:var(--accent);border-radius:5px}
.dial small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.final h2{font-size:clamp(38px,7vw,62px);font-weight:900}
.score{display:flex;flex-wrap:wrap;gap:10px}
.score div{border:1px solid var(--line);background:var(--panel2);border-radius:6px;padding:10px 14px;min-width:110px}
.score small{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.score b{font-family:var(--mono);font-size:22px;font-variant-numeric:tabular-nums}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.job{border:2px solid var(--ink);border-radius:6px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.job h3{font-size:24px}
.job .tag{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--steel);font-weight:700}
.job ul{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.board{width:100%;border-collapse:collapse;font-size:14px}
.board th,.board td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.board td.t{font-family:var(--mono);font-weight:700}
.board tr.me td{background:var(--ok-bg)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--bad);color:#fff;padding:8px 16px;border-radius:5px;font-family:var(--mono);font-weight:700;z-index:5}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.linkbtn{background:none;border:0;padding:4px 2px;color:var(--steel);font-weight:600;font-size:12px;text-decoration:underline;text-underline-offset:3px}
.presenter{border:2px dashed var(--muted);border-radius:6px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--panel)}
.presenter select{font:inherit;padding:6px 8px;border-radius:5px;border:2px solid var(--ink);background:var(--panel);max-width:100%}

/* página do manual */
.mpage .mset{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--panel)}
.mpage .mset h3{font-size:24px}
.mpage .mbody{padding:0}

@media (max-width:720px){
  .intro,.split,.jobs,.brief{grid-template-columns:1fr}
  .grid4{grid-template-columns:repeat(2,1fr)}
  .modes{grid-template-columns:1fr}
  .head h2{font-size:32px}
  .gauges{grid-template-columns:1fr}
}
@media (max-width:380px){ .manual > summary::after{content:"+";font-size:20px;text-decoration:none;line-height:1} .manual[open] > summary::after{content:"−"} .manual > summary b{overflow-wrap:anywhere} .grid3{grid-template-columns:repeat(2,1fr)} .mbody table{font-size:12.5px} .mbody th,.mbody td{padding:4px 5px} }
@media (prefers-reduced-motion:reduce){ *{transition:none!important;animation:none!important} }
/* painel sobreposto */
.sheet{position:fixed;inset:0;z-index:20;background:color-mix(in srgb,var(--ink) 55%,transparent);display:flex;justify-content:center;align-items:flex-start;padding:max(16px,env(safe-area-inset-top,0px)) 12px 16px;overflow-y:auto}
.sheet-in{background:var(--panel);border-radius:8px;border:1px solid var(--line);padding:16px;width:100%;max-width:760px;display:flex;flex-direction:column;gap:8px}
.sheet-in .mset{display:flex;flex-direction:column;gap:8px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--panel2)}
.sheet-in .mset h3{font-size:22px}
@media print{ body{background:#fff} body::before,.hud,.foot,.presenter,.toast,.noprint,.mpage .row{display:none!important} .stage{border:0;padding:0} .mset{break-inside:avoid} }
</style>
</head>
<body>

<div class="wrap">
  <header class="hud" id="hudbox" aria-label="Painel da partida">
    <div class="brand">Operação <span>Máquina</span></div>
    <div class="stat"><small>Código</small><b class="code" id="hCode">----</b></div>
    <div class="stat"><small>Tempo</small><b id="clock">00:00</b></div>
    <div class="stat"><small>Erros</small><b id="errs">0</b></div>
    <div class="slots" aria-label="Dígitos do código">
      <div class="slot" data-s="S1" id="slot0">·</div><div class="slot" data-s="S2" id="slot1">·</div><div class="slot" data-s="S3" id="slot2">·</div>
    </div>
  </header>
  <main id="app"></main>
  <div class="presenter" id="presenter" hidden>
    <span class="eyebrow">Modo apresentador</span>
    <div class="row"><select id="pSel" aria-label="Escolher minijogo"></select><button class="btn small primary" id="pGo">Abrir minijogo</button></div>
    <div class="row"><button class="btn small ghost" id="pHome">Início</button><button class="btn small ghost" id="pLock">Ir ao cadeado</button></div>
  </div>
  <div class="foot">
    <span>Operação Máquina · Projeto de extensão</span>
    <span class="row" style="gap:8px">
      <button class="linkbtn" id="manBtn">Manual do leitor</button>
      <button class="linkbtn" id="boardBtn">Placar</button>
      <button class="linkbtn" id="fsBtn">Tela cheia</button>
      <button class="linkbtn" id="presBtn">Modo apresentador</button>
    </span>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>

<script>
(function(){
/* ================= núcleo ================= */
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
const NS = 'http://www.w3.org/2000/svg';
function svgEl(tag, attrs, parent){ const e=document.createElementNS(NS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
const fmtN = (n,d=1) => n.toFixed(d).replace('.',',');

/* sorteio com semente: o mesmo código gera sempre a mesma partida */
const ALPH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function newCode(){ let s=''; for(let i=0;i<4;i++) s+=ALPH[Math.floor(Math.random()*ALPH.length)]; return s; }
function cleanCode(s){ return String(s||'').toUpperCase().replace(/[^A-Z0-9]/g,'').replace(/[IO01]/g,c=>({I:'J',O:'Q','0':'Q','1':'J'}[c])).slice(0,4); }
function hashStr(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){ h=Math.imul(h^str.charCodeAt(i),3432918353); h=h<<13|h>>>19; } h=Math.imul(h^(h>>>16),2246822507); h=Math.imul(h^(h>>>13),3266489909); return (h^=h>>>16)>>>0; }
function rngFrom(str){ let a=hashStr(str); return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const pick = (r,a) => a[Math.floor(r()*a.length)];
const rint = (r,a,b) => a+Math.floor(r()*(b-a+1));
function shuffle(r,a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

const GAMES=[];           // cada minijogo se registra aqui
const SETORES=['A Peça','O Movimento','O Projeto'];

function planFor(code, override){
  const r=rngFrom('plano:'+code);
  return [0,1,2].map(k=>{
    const pool=GAMES.filter(g=>g.setor===k);
    let g=pool[Math.floor(r()*pool.length)];
    const digit=Math.floor(r()*10);
    if(override && override[k]) g=GAMES.find(x=>x.id===override[k]);
    return {g, digit, inst:g.gen(rngFrom(code+':'+g.id))};
  });
}

/* ================= estado ================= */
const S={mode:'solo', code:newCode(), plan:null, override:{}, k:0, start:0, penalty:0, errors:0, hints:0, digits:[null,null,null], timer:null, solved:false, saved:false};

function fmtT(sec){ sec=Math.max(0,Math.floor(sec)); return String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0'); }
function elapsed(){ return S.start ? (Date.now()-S.start)/1000+S.penalty : 0; }
function tick(){ $('#clock').textContent=fmtT(elapsed()); }
let toastT;
function toast(t){ const e=$('#toast'); e.textContent=t; e.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>e.hidden=true,1400); }
function penalize(sec,count){ S.penalty+=sec; if(count){ S.errors++; $('#errs').textContent=S.errors; } toast('+'+sec+' s'); tick(); }
function setDigit(i,d){ S.digits[i]=d; const e=$('#slot'+i); e.textContent=d; e.classList.add('on'); }
function clearSlots(){ [0,1,2].forEach(i=>{ const e=$('#slot'+i); e.textContent='·'; e.classList.remove('on'); }); }
function hud(){ $('#hCode').textContent=S.code||'----'; $('#errs').textContent=S.errors; }
function store(k,v){ try{ if(v===undefined) return JSON.parse(localStorage.getItem(k)||'null'); localStorage.setItem(k,JSON.stringify(v)); }catch(e){ return null; } }
function top(){ window.scrollTo({top:0,behavior:reduce?'auto':'smooth'}); }
function startClock(){ S.running=true; S.start=Date.now(); S.penalty=0; S.errors=0; S.hints=0; S.digits=[null,null,null]; S.saved=false; clearSlots(); hud(); clearInterval(S.timer); S.timer=setInterval(tick,250); tick(); }
function stopClock(){ S.running=false; clearInterval(S.timer); S.timer=null; }

function manualBlock(g, open){
  return `<details class="manual"${open?' open':''}><summary><span class="rule-tag">Manual</span><b>${esc(g.titulo)}</b></summary><div class="mbody">${g.manual}</div></details>`;
}
function baseURL(){ return location.href.split('#')[0]; }
const SITE='https://saintcarmo1.github.io/-operacao-maquina/';
/* o QR e o link do manual sempre apontam para o site público,
   mesmo quando o jogo foi aberto direto do computador */
function publicURL(){ try{ if(/^https?:$/.test(location.protocol) && /github\.io$/.test(location.hostname)) return baseURL(); }catch(e){} return SITE; }
function setHash(h){ try{ history.replaceState(null,'',h||baseURL()); }catch(e){} }
function pushHash(h){ try{ history.pushState(null,'',h); }catch(e){} }
/* painel sobreposto: abre placar ou manual sem interromper a partida */
function openSheet(title,html){
  closeSheet();
  const d=document.createElement('div'); d.className='sheet'; d.id='sheet'; d.setAttribute('role','dialog'); d.setAttribute('aria-modal','true'); d.setAttribute('aria-label',title);
  d.innerHTML=`<div class="sheet-in"><div class="row" style="justify-content:space-between"><h2 style="font-size:28px">${esc(title)}</h2><button class="btn primary small" id="sheetX">Voltar ao jogo</button></div><p class="lede" style="font-size:13px">A partida continua: o tempo segue contando.</p>${html}</div>`;
  document.body.appendChild(d); d.addEventListener('click',e=>{ if(e.target===d) closeSheet(); }); $('#sheetX').onclick=closeSheet; $('#sheetX').focus();
}
function closeSheet(){ const d=$('#sheet'); if(d) d.remove(); }
document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
function boardHTML(focus){
  const list=(store('om-placar')||[]).slice().sort((a,b)=>a.t-b.t);
  if(!list.length) return '<div class="msg">Ainda não há tempos salvos neste aparelho.</div>';
  return `<div style="overflow-x:auto"><table class="board"><thead><tr><th>#</th><th>Equipe</th><th>Tempo</th><th>Erros</th><th>Código</th></tr></thead><tbody>${list.slice(0,30).map((x,i)=>`<tr class="${x.c===focus?'me':''}"><td>${i+1}º</td><td>${esc(x.n)}</td><td class="t">${fmtT(x.t)}</td><td>${x.e}</td><td class="t">${esc(x.c)}</td></tr>`).join('')}</tbody></table></div>`;
}

/* ================= telas ================= */
function home(){
  closeSheet(); stopClock(); S.start=0; tick(); clearSlots(); S.override={};
  if(location.hash) setHash('');
  hud();
  $('#app').innerHTML=`
  <section class="stage">
    <div class="intro">
      <div class="head">
        <p class="eyebrow">Escape room de engenharia</p>
        <h2>A esteira da fábrica <em>parou.</em></h2>
        <p class="lede">Três setores da máquina quebraram ao mesmo tempo. Conserte cada um para ganhar um dígito e use o código para religar a máquina. São 15 desafios diferentes: cada partida sorteia 3.</p>

/* ================= utilidades de desenho ================= */
function gearPath(z,K){
  const r=K*z, ro=r+K*1.1, rr=r-K*1.25, p=2*Math.PI/z; let d='';
  for(let i=0;i<z;i++){ const a=i*p;
    [[rr,a-.5*p],[rr,a-.28*p],[ro,a-.13*p],[ro,a+.13*p],[rr,a+.28*p]].forEach(([R,A],j)=>{ d+=(i===0&&j===0?'M':'L')+(R*Math.cos(A)).toFixed(2)+' '+(R*Math.sin(A)).toFixed(2); }); }
  return d+'Z';
}
function arrowG(g,color){ // seta circular no sentido horário
  g.innerHTML='';
  svgEl('path',{d:'M -6.06 3.5 A 7 7 0 1 1 3.5 6.06',fill:'none',stroke:color,'stroke-width':2.2,'stroke-linecap':'round'},g);
  svgEl('polygon',{points:'0.9,8.6 5.5,8.66 2.2,2.9',fill:color},g);
}
function animate(dur,step,done){
  if(reduce||!dur){ step(1); done&&done(); return; }
  const t0=performance.now(); const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  (function f(now){ const t=Math.min(1,(now-t0)/dur); step(ease(t)); if(t<1) requestAnimationFrame(f); else done&&done(); })(t0);
}

function choiceGroup(box, items, render, onPick){
  box.innerHTML=items.map((it,i)=>`<button class="pick" data-i="${i}" aria-pressed="false">${render(it,i)}</button>`).join('');
  const bs=Array.from(box.querySelectorAll('.pick'));
  bs.forEach(b=>b.onclick=()=>{ bs.forEach(x=>{ x.setAttribute('aria-pressed',String(x===b)); x.classList.remove('wrong'); }); onPick(items[+b.dataset.i], +b.dataset.i, b); });
  return bs;
}
function segGroup(box, opts, val, onPick){
  box.innerHTML=opts.map(o=>`<button data-v="${esc(o.v)}" aria-pressed="${String(o.v)===String(val)}">${o.t}</button>`).join('');
  box.querySelectorAll('button').forEach(b=>b.onclick=()=>{ box.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',String(x===b))); onPick(b.dataset.v); });
}

  id:'recicla', setor:0, titulo:'Triagem de resíduos',

   <tr><td><span class="sw" style="background:#E9731C"></span>Laranja</td><td>Resíduos perigosos</td></tr>
   <tr><td><span class="sw" style="background:#7A4B28"></span>Marrom</td><td>Orgânicos (restos de comida)</td></tr>
   <tr><td><span class="sw" style="background:#8A9299"></span>Cinza</td><td>Não recicláveis</td></tr></tbody></table></div>
   <p><b>Atenção às exceções:</b></p><ul>
   <li><b>Pilhas e baterias</b> têm metal, mas são <b>perigosas</b>: laranja.</li>

});

/* --- 1D Tratamento térmico --- */
const TT_PECAS=[['Lâmina de faca','dura'],['Broca de furadeira','dura'],['Talhadeira','dura'],['Mola de suspensão','mola'],['Grampo de pasta','mola'],
  ['Chapa para dobrar','macia'],['Arame para artesanato','macia'],['Eixo recém-forjado','uniforme'],['Barra recém-forjada','uniforme']];
const TT_PROG={dura:[[850,'agua'],[200,'ar']],mola:[[850,'agua'],[450,'ar']],macia:[[850,'forno']],uniforme:[[850,'ar']]};
const RESF={agua:'Água',ar:'Ar',forno:'Dentro do forno'};
GAMES.push({
  id:'termico', setor:0, titulo:'Forno de tratamento',
  lede:'Uma peça de aço precisa passar pelo forno para ganhar a propriedade certa. Programe o aquecimento e o resfriamento.',
  manual:`<p><b>1. Que propriedade a peça precisa?</b></p><ul>
   <li>Ferramentas de corte (faca, broca, talhadeira): <b>DURA</b>.</li>
   <li>Molas e grampos: <b>DURA E FLEXÍVEL</b>.</li>
   <li>Peças que vão ser dobradas (chapas, arames): <b>MACIA</b>.</li>
   <li>Peças recém-forjadas: <b>UNIFORME</b>.</li></ul>
   <p><b>2. Programa do forno:</b></p>
   <div class="tw"><table><thead><tr><th>Propriedade</th><th>Etapa 1</th><th>Etapa 2</th></tr></thead><tbody>
   <tr><td>Dura</td><td>850 °C · resfriar na água (têmpera)</td><td>200 °C · resfriar no ar (revenimento)</td></tr>
   <tr><td>Dura e flexível</td><td>850 °C · resfriar na água</td><td>450 °C · resfriar no ar</td></tr>
   <tr><td>Macia</td><td>850 °C · resfriar dentro do forno, devagar (recozimento)</td><td>não tem</td></tr>
   <tr><td>Uniforme</td><td>850 °C · resfriar no ar (normalização)</td><td>não tem</td></tr></tbody></table></div>`,
  dica:'O tipo de peça diz a propriedade. Resfriar rápido (água) endurece; resfriar devagar (forno) amacia.',
  gen(r){ const p=pick(r,TT_PECAS); return {p, prog:TT_PROG[p[1]]}; },
  render(box,I,api){
    const st={t1:null,c1:null,two:false,t2:null,c2:null};
    box.innerHTML=`<div class="situ"><span class="lbl">Peça no forno</span><h3>${I.p[0]}</h3></div>
      <div class="split"><div class="col">
        <p class="lbl">Etapa 1 · aquecer a</p><div class="seg" id="t1"></div><p class="lbl">e resfriar</p><div class="seg" id="c1"></div>
        <label class="row" style="gap:8px;font-weight:600"><input type="checkbox" id="two" style="width:20px;height:20px"> Usar etapa 2</label>
        <div id="e2" class="col" hidden><p class="lbl">Etapa 2 · aquecer a</p><div class="seg" id="t2"></div><p class="lbl">e resfriar</p><div class="seg" id="c2"></div></div>
      </div><div class="col"><div class="bench"><svg id="ttg" viewBox="0 0 300 160" role="img" aria-label="Gráfico de temperatura do programa"></svg></div>
        <button class="btn primary" id="run">Ligar o forno</button></div></div>`;
    const temps=[200,450,850].map(v=>({v,t:v+' °C'})), cools=Object.keys(RESF).map(v=>({v,t:RESF[v]}));
    segGroup($('#t1'),temps,null,v=>{st.t1=+v;draw();}); segGroup($('#c1'),cools,null,v=>{st.c1=v;draw();});
    segGroup($('#t2'),temps,null,v=>{st.t2=+v;draw();}); segGroup($('#c2'),cools,null,v=>{st.c2=v;draw();});
    $('#two').onchange=e=>{ st.two=e.target.checked; $('#e2').hidden=!st.two; draw(); };
    function draw(){
      const g=$('#ttg'); g.innerHTML='';
      svgEl('line',{x1:30,y1:140,x2:290,y2:140,stroke:'var(--ink)'},g); svgEl('line',{x1:30,y1:10,x2:30,y2:140,stroke:'var(--ink)'},g);
      [200,450,850].forEach(v=>{ const y=140-v/900*125; svgEl('line',{x1:30,y1:y,x2:290,y2:y,stroke:'var(--line)','stroke-dasharray':'3 3'},g); const t=svgEl('text',{x:26,y:y+4,'text-anchor':'end','font-size':9,fill:'var(--muted)'},g); t.textContent=v; });
      const tx=svgEl('text',{x:160,y:156,'text-anchor':'middle','font-size':9,fill:'var(--muted)'},g); tx.textContent='tempo →';
      let x=30, pts=[[30,140]];
      const seg=(T,C)=>{ if(!T) return; const y=140-T/900*125; pts.push([x+20,y],[x+50,y]); x+=50; const fall=C==='agua'?8:C==='ar'?30:70; if(C){ pts.push([x+fall,140]); x+=fall; } };
      seg(st.t1,st.c1); if(st.two) seg(st.t2,st.c2);
      svgEl('polyline',{points:pts.map(p=>p.join(',')).join(' '),fill:'none',stroke:'var(--bad)','stroke-width':3,'stroke-linejoin':'round'},g);
    }
    draw();
    $('#run').onclick=()=>{
      if(api.done()) return;
      const got=[[st.t1,st.c1]].concat(st.two?[[st.t2,st.c2]]:[]);
      if(got.some(s=>!s[0]||!s[1])){ api.say('Escolha a temperatura e o resfriamento de cada etapa.'); return; }
      const ok=got.length===I.prog.length && got.every((s,i)=>s[0]===I.prog[i][0]&&s[1]===I.prog[i][1]);
      if(ok) api.win(); else api.wrong(`A peça saiu ${got[0][1]==='agua'&&!st.two?'dura, mas frágil como vidro':got[0][1]==='forno'?'macia demais':'com a propriedade errada'}. Confira o programa no manual.`);
    };
  },
  explica:I=>`A ${I.p[0].toLowerCase()} precisava ficar <b>${{dura:'dura',mola:'dura e flexível',macia:'macia',uniforme:'uniforme'}[I.p[1]]}</b>. Mudar as propriedades do aço com calor é o tratamento térmico.`
});

const TR_APPS=[['Viga de prédio','rig'],['Base de máquina de precisão','rig'],['Cabo de elevador','res'],['Gancho de guindaste','res'],['Para-choque de carro','duc'],['Clipe de papel','duc'],['Lata de refrigerante','duc']];

  id:'tracao', setor:0, titulo:'Ensaio de tração',
  lede:'Três amostras foram esticadas até romper. O gráfico mostra o resultado de cada uma. Escolha a amostra certa para a peça.',
  manual:`<p><b>1. Do que a peça precisa?</b></p><ul>
   <li>Viga de prédio, base de máquina: <b>RIGIDEZ</b> (não pode deformar).</li>
   <li>Cabo de elevador, gancho de guindaste: <b>RESISTÊNCIA</b> (aguentar mais força).</li>
   <li>Para-choque, clipe, lata: <b>DUCTILIDADE</b> (esticar e dobrar sem quebrar).</li></ul>
   <p><b>2. Como ler o gráfico</b> (tensão para cima, deformação para a direita):</p><ul>
   <li><b>Rigidez:</b> a linha que <b>sobe mais em pé</b> logo no começo.</li>
   <li><b>Resistência:</b> a linha que chega ao <b>ponto mais alto</b>.</li>
   <li><b>Ductilidade:</b> a linha que vai <b>mais longe para a direita</b> antes de romper (o X).</li></ul>`,
  dica:'Identifique primeiro a propriedade pela peça. Depois olhe só para aquele detalhe do gráfico: início em pé, ponto mais alto ou ponto mais à direita.',
  gen(r){
    const app=pick(r,TR_APPS);
    const roles=shuffle(r,['rig','res','duc']); // cada letra é a melhor em uma propriedade
    const base={rig:{E:rint(r,52,60),U:rint(r,52,62),F:rint(r,14,22)},res:{E:rint(r,30,38),U:rint(r,86,96),F:rint(r,40,52)},duc:{E:rint(r,16,22),U:rint(r,40,50),F:rint(r,82,94)}};
    const curves=roles.map((ro,i)=>({L:'ABC'[i],ro,...base[ro]}));

  },
  render(box,I,api){
    box.innerHTML=`<div class="situ"><span class="lbl">Peça</span><h3>${I.app[0]}</h3></div>
      <div class="bench"><svg id="trg" viewBox="0 0 340 210" role="img" aria-label="Gráfico tensão por deformação com as amostras A, B e C"></svg></div>
      <p class="lbl">Qual amostra usar?</p><div class="grid3" id="ab"></div>`;
    const g=$('#trg'), X0=34, Y0=184, W=290, H=165, cols=['var(--steel)','var(--bad)','var(--ok)'], dash=['','6 4','2 3'];
    svgEl('line',{x1:X0,y1:Y0,x2:X0+W,y2:Y0,stroke:'var(--ink)'},g); svgEl('line',{x1:X0,y1:Y0,x2:X0,y2:Y0-H,stroke:'var(--ink)'},g);
    const t1=svgEl('text',{x:X0+W,y:Y0+16,'text-anchor':'end','font-size':10,fill:'var(--muted)'},g); t1.textContent='deformação →';
    const t2=svgEl('text',{x:14,y:Y0-H/2,'text-anchor':'middle','font-size':10,fill:'var(--muted)',transform:`rotate(-90 14 ${Y0-H/2})`},g); t2.textContent='tensão →';
    I.curves.forEach((c,i)=>{
      const sx=v=>X0+v/100*W, sy=v=>Y0-v/100*H;
      const ey=c.U*0.75, ex=ey/c.E*12; const pts=[[0,0],[ex,ey]];
      for(let k=1;k<=12;k++){ const t=k/12, xx=ex+(c.F*0.8-ex)*t, yy=ey+(c.U-ey)*Math.sin(t*Math.PI/2); pts.push([xx,yy]); }
      pts.push([c.F,c.U*0.9]);
      svgEl('polyline',{points:pts.map(p=>sx(p[0]).toFixed(1)+','+sy(p[1]).toFixed(1)).join(' '),fill:'none',stroke:cols[i],'stroke-width':3,'stroke-dasharray':dash[i],'stroke-linejoin':'round'},g);
      const fx=sx(c.F), fy=sy(c.U*0.9);
      svgEl('path',{d:`M${fx-5} ${fy-5} L${fx+5} ${fy+5} M${fx+5} ${fy-5} L${fx-5} ${fy+5}`,stroke:cols[i],'stroke-width':2.5},g);
      const lb=svgEl('text',{x:Math.min(fx+8,X0+W-4),y:fy-8,'font-size':15,'font-weight':800,fill:cols[i]},g); lb.textContent=c.L;
    });
    choiceGroup($('#ab'),I.curves,c=>`<b style="font-size:18px">Amostra ${c.L}</b>`,(c,i,b)=>{ if(api.done()) return; if(c.L===I.ans) api.win(); else { b.classList.add('wrong'); api.wrong(`A amostra ${c.L} não é a melhor nessa propriedade.`); } });
  },
  explica:I=>{ const p={rig:'rigidez (a linha mais em pé no início)',res:'resistência (o ponto mais alto)',duc:'ductilidade (vai mais longe antes de romper)'}[I.app[1]]; return `Para ${I.app[0].toLowerCase()} importa a <b>${p}</b>: amostra ${I.ans}. O ensaio de tração é um dos testes mais usados para conhecer um material.`; }
});

/* --- 2A Sentido de giro --- */
const GIRO_LAYOUTS=[
  [{id:'M',z:14,x:66,y:176},{id:'A',z:18,p:'M',ang:-32},{id:'B',z:10,p:'A',ang:-84},{id:'C',z:12,p:'A',ang:18},{id:'S',z:16,p:'C',ang:-42}],
  [{id:'M',z:12,x:50,y:150},{id:'A',z:14,p:'M',ang:-35},{id:'B',z:10,p:'A',ang:30},{id:'C',z:16,p:'B',ang:-25},{id:'S',z:12,p:'C',ang:40}],
  [{id:'M',z:16,x:190,y:140},{id:'A',z:12,p:'M',ang:180},{id:'B',z:12,p:'M',ang:-60},{id:'C',z:10,p:'M',ang:60},{id:'S',z:12,p:'A',ang:120}]
];
GAMES.push({
  id:'giro', setor:1, titulo:'Caixa de engrenagens',
  lede:'A caixa de engrenagens foi remontada. Antes de ligar, preveja para que lado cada engrenagem vai girar. Uma previsão errada trava a transmissão.',
  manual:`<ul><li><b>Engrenagens que se encostam giram em sentidos opostos.</b> Se uma gira no sentido horário, a vizinha gira no anti-horário.</li>
   <li>Duas engrenagens que encostam na <b>mesma</b> engrenagem giram para o <b>mesmo lado</b>.</li>
   <li>Comece sempre pelo <b>motor</b> e siga a corrente, uma engrenagem por vez.</li></ul>
   <p class="note">Sentido horário: como os ponteiros de um relógio. Anti-horário: ao contrário.</p>`,
  dica:'Comece pela engrenagem que encosta no motor: ela gira ao contrário dele. Depois veja quem encosta nela, e assim por diante.',
  gen(r){
    const L=pick(r,[0,1,2]); const md=pick(r,[1,-1]); const K=3;
    const nodes=GIRO_LAYOUTS[L].map(n=>({...n})); const by={};
    nodes.forEach(n=>{ by[n.id]=n; if(n.p){ const p=by[n.p], d=K*(p.z+n.z), a=n.ang*Math.PI/180; n.x=p.x+d*Math.cos(a); n.y=p.y+d*Math.sin(a); n.dir=-p.dir; } else n.dir=md; });
    return {nodes,md};
  },
  render(box,I,api){
    const K=3, guess={}; let ok=false, solved=false;
    box.innerHTML=`<div class="situ"><span class="lbl">Motor</span><h3>O motor gira no sentido ${I.md===1?'HORÁRIO':'ANTI-HORÁRIO'}</h3></div>
      <div class="bench"><svg id="gs" viewBox="0 0 380 260" role="img" aria-label="Caixa com motor e engrenagens A, B, C e saída"></svg></div>
      <p class="lede" style="font-size:14px">Toque no centro de cada engrenagem para marcar o sentido. Depois confira.</p>
      <div class="row"><button class="btn primary" id="chk">Conferir previsão</button><button class="btn" id="crank" hidden>Ligar o motor</button></div>`;
    const svg=$('#gs'), by={};
    I.nodes.forEach(n=>{ by[n.id]=n; n.g=svgEl('g',{},svg); svgEl('path',{d:gearPath(n.z,K),fill:n.id==='M'?'var(--accent)':n.id==='S'?'var(--gear-out)':'var(--gear2)',stroke:'var(--ink)','stroke-width':1},n.g); });
    I.nodes.forEach(n=>{
      const b=svgEl('g',{transform:`translate(${n.x.toFixed(1)} ${n.y.toFixed(1)})`,class:'badge'+(n.id==='M'?' fixed':''),tabindex:n.id==='M'?-1:0,role:'button','aria-label':n.id==='M'?'Motor':'Marcar sentido da engrenagem '+n.id},svg);
      svgEl('circle',{r:24,fill:'transparent'},b); svgEl('circle',{r:15,class:'face',fill:'var(--panel)',stroke:'var(--ink)','stroke-width':2},b);
      n.icon=svgEl('g',{},b); const t=svgEl('text',{y:-20,'text-anchor':'middle','font-size':12,'font-weight':800,fill:'var(--ink)',stroke:'var(--panel)','stroke-width':3,'paint-order':'stroke'},b); t.textContent=n.id==='M'?'Motor':n.id==='S'?'Saída':n.id; n.badge=b;
      if(n.id==='M'){ const a=svgEl('g',{transform:I.md===1?'':'scale(-1 1)'},n.icon); arrowG(a,'var(--ink)'); }
      else { setI(n); const act=()=>{ if(ok) return; guess[n.id]=guess[n.id]===1?-1:1; b.classList.remove('wrong'); setI(n); }; b.addEventListener('click',act); b.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); act(); } }); }
    });
    function setI(n){ n.icon.innerHTML=''; const v=guess[n.id]; if(!v){ const t=svgEl('text',{y:6,'text-anchor':'middle','font-size':17,'font-weight':700,fill:'var(--muted)'},n.icon); t.textContent='?'; return; } const a=svgEl('g',{transform:v===1?'':'scale(-1 1)'},n.icon); arrowG(a,'var(--ink)'); }
    function pose(th){ const rot={}; I.nodes.forEach(n=>{ if(!n.p) rot[n.id]=th*I.md; else { const p=by[n.p]; rot[n.id]=-(p.z/n.z)*(rot[p.id]-n.ang)+n.ang+180+180/n.z; } n.g.setAttribute('transform',`translate(${n.x.toFixed(1)} ${n.y.toFixed(1)}) rotate(${rot[n.id].toFixed(1)})`); }); }
    pose(0);
    $('#chk').onclick=()=>{
      const open=I.nodes.filter(n=>n.p&&!guess[n.id]); if(open.length){ api.say('Ainda falta marcar: <b>'+open.map(n=>n.id==='S'?'Saída':n.id).join(', ')+'</b>.'); return; }
      const wr=I.nodes.filter(n=>n.p&&guess[n.id]!==n.dir);
      if(wr.length){ wr.forEach(n=>n.badge.classList.add('wrong')); api.wrong(`${wr.length===1?'Uma previsão está errada':wr.length+' previsões estão erradas'} (em vermelho). Siga a corrente a partir do motor.`); return; }
      ok=true; I.nodes.forEach(n=>n.badge.classList.add('right')); $('#chk').hidden=true; $('#crank').hidden=false;
      api.say('<b>Previsão certa!</b> Ligue o motor para ver a transmissão funcionando.','ok');
    };
    $('#crank').onclick=()=>{ $('#crank').disabled=true; animate(2400,t=>pose(360*t),()=>{ $('#crank').disabled=false; if(!solved){ solved=true; api.win(); } }); };
  },
  explica:I=>`Cada engrenagem gira ao contrário da vizinha. É assim que engenheiros mecânicos definem para que lado uma esteira, uma roda ou um ponteiro vai andar.`
});

GAMES.push({
  id:'rpm', setor:1, titulo:'Velocidade da esteira',
  lede:'A esteira precisa girar numa velocidade exata. Escolha a engrenagem de saída que deixa a esteira na rotação pedida.',
  manual:`<p><b>Fórmula da transmissão:</b></p>
   <p style="font-size:16px"><b>rpm da saída = rpm do motor × dentes do motor ÷ dentes da saída</b></p>
   <ul><li>rpm = rotações por minuto (voltas por minuto).</li>
   <li>Engrenagem de saída <b>maior</b> que a do motor: gira <b>mais devagar</b> e com mais força.</li>
   <li>Engrenagem de saída <b>menor</b>: gira <b>mais rápido</b>.</li></ul>
   <p class="note">Exemplo: motor de 120 rpm com 10 dentes e saída de 30 dentes: 120 × 10 ÷ 30 = 40 rpm.</p>`,
  dica:'Use a fórmula ao contrário: dentes da saída = rpm do motor × dentes do motor ÷ rpm pedido.',
  gen(r){
    for(let tries=0;tries<200;tries++){
      const zm=pick(r,[10,12,15,18,20]), rm=pick(r,[60,90,120,150,180]);
      const cands=[10,12,15,18,20,24,30,36,40,45].filter(z=>z!==zm&&(rm*zm)%z===0);
      if(cands.length<1) continue; const zo=pick(r,cands); const target=rm*zm/zo;
      const others=shuffle(r,[10,12,15,18,20,24,30,36,40,45].filter(z=>z!==zo&&rm*zm/z!==target)).slice(0,3);
      return {zm,rm,zo,target,opts:shuffle(r,[zo,...others])};
    }
  },
  render(box,I,api){
    const K=Math.min(3.4,320/(2*I.zm+2*Math.max(...I.opts)+8)); let cur=null, spinning=false;
    box.innerHTML=`<div class="situ"><span class="lbl">Pedido da produção</span><h3>A esteira precisa de ${I.target} rpm</h3><p>Motor: <b>${I.rm} rpm</b>, engrenagem de <b>${I.zm} dentes</b>.</p></div>
      <div class="split"><div class="bench"><svg id="rs" viewBox="0 0 380 230" role="img" aria-label="Motor e engrenagem de saída"></svg></div>
      <div class="col"><p class="lbl">Engrenagem de saída</p><div class="grid2" id="ro"></div>
      <button class="btn primary" id="ron" disabled>Ligar e medir</button><div class="readout" id="tach">Medidor: — rpm</div></div></div>`;
    const svg=$('#rs');
    const M={x:30+K*I.zm+8,y:118};
    const mg=svgEl('g',{},svg); svgEl('path',{d:gearPath(I.zm,K),fill:'var(--accent)',stroke:'var(--ink)'},mg);
    const ml=svgEl('text',{x:8,y:208,'text-anchor':'start','font-size':12,'font-weight':700,fill:'var(--ink)'},svg); ml.textContent=`Motor (amarelo) · ${I.zm} dentes`;
    const og=svgEl('g',{},svg), ol=svgEl('text',{x:8,y:225,'text-anchor':'start','font-size':12,'font-weight':700,fill:'var(--ink)'},svg);
    let O={x:0,y:118};
    function place(z){ og.innerHTML=''; if(!z){ ol.textContent=''; return; } O.x=M.x+K*(I.zm+z); svgEl('path',{d:gearPath(z,K),fill:'var(--gear-out)',stroke:'var(--ink)','fill-opacity':.9},og); svgEl('line',{x1:0,y1:0,x2:0,y2:-K*z+6,stroke:'var(--bad)','stroke-width':4,'stroke-linecap':'round'},og); ol.textContent=`Saída (azul) · ${z} dentes`; pose(0); }
    function pose(th){ mg.setAttribute('transform',`translate(${M.x} ${M.y}) rotate(${th})`); if(cur){ const a=-(I.zm/cur)*th+180+180/cur; og.setAttribute('transform',`translate(${O.x} ${O.y}) rotate(${a})`); } }
    pose(0);
    choiceGroup($('#ro'),I.opts,z=>`<b>${z} dentes</b>`,z=>{ if(spinning) return; cur=z; place(z); $('#ron').disabled=api.done(); $('#tach').textContent='Medidor: — rpm'; });
    $('#ron').onclick=()=>{
      if(!cur||spinning||api.done()) return; spinning=true; const rpm=I.rm*I.zm/cur;
      animate(1800,t=>{ pose(540*t); $('#tach').textContent='Medidor: '+Math.round(rpm*t)+' rpm'; },()=>{
        spinning=false; $('#tach').textContent='Medidor: '+fmtN(rpm,rpm%1?1:0)+' rpm';
        if(cur===I.zo) api.win(); else api.wrong(`Com ${cur} dentes a esteira ficou em ${fmtN(rpm,rpm%1?1:0)} rpm, e o pedido é ${I.target} rpm.`);
      });
    };
  },
  explica:I=>`${I.rm} × ${I.zm} ÷ ${I.zo} = <b>${I.target} rpm</b>. Calcular a relação de transmissão é básico no projeto de máquinas.`
});

GAMES.push({
  id:'alavanca', setor:1, titulo:'Alavanca de equilíbrio',
  lede:'A alavanca levanta peças pesadas, mas precisa ficar equilibrada. Escolha em que furo pendurar o contrapeso.',
  manual:`<p><b>Regra do momento:</b> peso × distância de um lado = peso × distância do outro lado.</p>

   <li>Furo do contrapeso = (peso da carga × furo da carga) ÷ peso do contrapeso.</li>
   <li>Quanto <b>mais longe</b> do apoio, <b>menos peso</b> é preciso para equilibrar.</li></ul>

    svgEl('line',{x1:20,y1:C.y+46,x2:340,y2:C.y+46,stroke:'var(--ink)','stroke-width':2},svg); const hint=svgEl('text',{x:C.x+sp*3.5,y:C.y+62,'text-anchor':'middle','font-size':10,fill:'var(--muted)'},svg); hint.textContent='toque num furo deste lado';

    const cw=svgEl('g',{},beam);

    function drawCW(){ cw.innerHTML=''; if(!hole) return; const x=C.x+sp*hole; svgEl('rect',{x:x-11,y:C.y-32,width:22,height:26,fill:'var(--accent)',stroke:'var(--ink)',rx:3},cw); const t=svgEl('text',{x,y:C.y-40,'text-anchor':'middle','font-size':12,'font-weight':800,fill:'var(--ink)'},cw); t.textContent=I.M+' kg'; svgEl('circle',{cx:x,cy:C.y,r:6,fill:'none',stroke:'var(--accent)','stroke-width':3},cw); }
    const tilt=a=>beam.setAttribute('transform',`rotate(${a} ${C.x} ${C.y})`);

/* --- 2D Sistema de polias --- */
const POL_SYS=[[1,0],[2,0],[3,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2],[1,3]];
function drawPulleys(svg,f,m){
  svg.innerHTML='';
  svgEl('rect',{x:4,y:4,width:112,height:7,fill:'var(--ink)'},svg);
  for(let x=8;x<116;x+=8) svgEl('line',{x1:x,y1:4,x2:x-5,y2:0,stroke:'var(--ink)'},svg);
  const fx=[], mx=[];
  for(let i=0;i<f;i++){ const x=f===1?60:24+i*(72/(f-1)); fx.push(x); svgEl('line',{x1:x,y1:11,x2:x,y2:24,stroke:'var(--ink)','stroke-width':2},svg); svgEl('circle',{cx:x,cy:32,r:9,fill:'var(--gear2)',stroke:'var(--ink)','stroke-width':1.5},svg); svgEl('circle',{cx:x,cy:32,r:2,fill:'var(--ink)'},svg); }
  for(let i=0;i<m;i++){ const x=m===1?60:30+i*(60/(m-1)); mx.push(x); }
  const my=82;

  manual:`<p><b>Quanto o material estica:</b></p>
   <p style="font-size:16px"><b>dilatação (mm) = α × comprimento (m) × variação de temperatura (°C) ÷ 1000</b></p>
   <div class="tw"><table><thead><tr><th>Material</th><th>α</th></tr></thead><tbody>${Object.keys(ALFA).map(k=>`<tr><td>${k}</td><td>${ALFA[k]}</td></tr>`).join('')}</tbody></table></div>
   <ul><li>Variação de temperatura = máxima − mínima.</li>
   <li>Escolha a <b>menor junta que seja maior ou igual</b> à dilatação. Junta pequena demais: o trilho entorta. Grande demais: o trem trepida.</li></ul>
   <p class="note">Exemplo: aço, 10 m, de 10 °C a 50 °C: 12 × 10 × 40 ÷ 1000 = 4,8 mm → junta de 5 mm.</p>`,
  dica:'Calcule a variação de temperatura (máxima menos mínima), multiplique pelo α do material e pelo comprimento, e divida por 1000.',
  gen(r){
    for(;;){ const mat=pick(r,Object.keys(ALFA)), L=pick(r,[5,10,12,20,25]), tmin=pick(r,[0,5,10,15]), tmax=pick(r,[35,40,45,50]);
      const dl=ALFA[mat]*L*(tmax-tmin)/1000; const G=[1,2,3,5,8,10,12,15,20,25,30,40];
      const ans=G.find(g=>g>=dl-1e-9); if(!ans||Math.abs(ans-dl)<0.05) continue; const ai=G.indexOf(ans); if(ai<1||ai>G.length-2) continue;
      const opts=[G[ai-1],ans,G[ai+1],G[Math.min(G.length-1,ai+2)]]; if(new Set(opts).size<4) continue;
      return {mat,L,tmin,tmax,dl,ans,opts:shuffle(r,opts)}; }
  },
  render(box,I,api){
    let cur=null;
    box.innerHTML=`<div class="situ"><span class="lbl">Trilho</span><h3>${I.mat} · ${I.L} m de comprimento</h3><p>Temperatura: mínima de <b>${I.tmin} °C</b> no inverno, máxima de <b>${I.tmax} °C</b> no verão.</p></div>
      <div class="bench"><svg id="ds" viewBox="0 0 360 120" role="img" aria-label="Dois trilhos com uma junta entre eles"></svg></div>
      <p class="lbl">Tamanho da junta</p><div class="grid4" id="dop"></div>
      <div class="row"><button class="btn primary" id="sum" disabled>Simular o verão</button></div>`;
    const svg=$('#ds'), col={'Aço':'#7E8B96','Alumínio':'#C9D3DB','Concreto':'#A7A39A','Cobre':'#C2643A'}[I.mat];
    const g1=svgEl('g',{},svg), g2=svgEl('g',{},svg);
    for(let x=10;x<350;x+=26) svgEl('rect',{x,y:78,width:14,height:22,fill:'var(--gear2)'},svg);
    function rails(gap,ext,bend){ g1.innerHTML=''; g2.innerHTML=''; const half=gap*2.2; const lx=180-half/2, rx=180+half/2;
      if(bend){ svgEl('path',{d:`M10 70 Q${(10+lx+ext)/2} ${40} ${lx+ext} 70`,stroke:col,'stroke-width':14,fill:'none'},g1); }
      else svgEl('rect',{x:10,y:62,width:lx+ext-10,height:16,fill:col,stroke:'var(--ink)'},g1);
      svgEl('rect',{x:rx-ext,y:62,width:350-(rx-ext),height:16,fill:col,stroke:'var(--ink)'},g2);
      if(cur){ const t=svgEl('text',{x:180,y:50,'text-anchor':'middle','font-size':12,'font-weight':700,fill:'var(--ink)'},g2); t.textContent=`junta: ${gap} mm`; } }
    rails(4,0,false);
    choiceGroup($('#dop'),I.opts,g=>`<b style="font-size:17px">${g} mm</b>`,g=>{ cur=g; rails(g,0,false); $('#sum').disabled=api.done(); });
    $('#sum').onclick=()=>{
      if(!cur||api.done()) return; const ext=Math.min(I.dl,cur)*1.1;
      animate(1200,t=>rails(cur,ext*t,false),()=>{
        if(cur<I.dl-1e-9){ rails(cur,ext,true); api.wrong(`O trilho esticou ${fmtN(I.dl,1)} mm e a junta de ${cur} mm não deu conta: ele entortou.`); setTimeout(()=>rails(cur,0,false),1400); }
        else if(cur!==I.ans){ api.wrong(`A junta de ${cur} mm é grande demais: sobra folga e o trem trepida. Use a menor junta que ainda seja maior que a dilatação.`); rails(cur,0,false); }
        else api.win();
      });
    };
  },
  explica:I=>`${ALFA[I.mat]} × ${I.L} × ${I.tmax-I.tmin} ÷ 1000 = ${fmtN(I.dl,1)} mm, então a junta é de <b>${I.ans} mm</b>. Pontes, trilhos e calçadas têm juntas por causa da dilatação térmica.`
});

/* --- 3D Parafusos sem corrosão --- */
const GALV=['Magnésio','Zinco','Alumínio','Aço carbono','Latão','Cobre','Aço inox','Titânio'];
const GCOL={'Magnésio':'#E3E6E8','Zinco':'#A9B6C2','Alumínio':'#D3DBE1','Aço carbono':'#6B767E','Latão':'#D4AF4A','Cobre':'#C2643A','Aço inox':'#C0C9D0','Titânio':'#9AA0A6'};
GAMES.push({
  id:'parafuso', setor:2, titulo:'Parafusos sem corrosão',
  lede:'Uma chapa de metal vai ser presa com parafusos. Metais diferentes encostados podem corroer. Escolha o parafuso certo.',
  manual:`<p><b>Lista galvânica</b> (do metal que corrói mais fácil ao mais resistente):</p>
   <ol>${GALV.map(g=>`<li>${g}</li>`).join('')}</ol>
   <ul><li><b>Ambiente úmido</b> (perto do mar, ao ar livre): o parafuso deve ser do <b>mesmo metal da chapa</b> ou o <b>próximo da lista</b> (um número abaixo).</li>
   <li><b>Ambiente seco</b> (dentro de um galpão fechado): use sempre <b>Aço carbono</b>, que é o mais barato.</li></ul>
   <p class="note">Com umidade, o metal que vem antes na lista corrói quando encosta num metal que vem bem depois. É a corrosão galvânica.</p>`,
  dica:'Primeiro veja se o ambiente é úmido ou seco. No úmido, ache a chapa na lista: serve o mesmo metal ou o que vem logo depois.',
  gen(r){
    for(;;){ const umido=r()<.7; const chapa=pick(r,['Zinco','Alumínio','Aço carbono','Latão','Cobre','Aço inox']);
      const i=GALV.indexOf(chapa); const valid=umido?[chapa,GALV[i+1]]:['Aço carbono'];
      if(!umido&&chapa==='Aço carbono') continue;
      const ans=pick(r,valid); const bad=GALV.filter(g=>!valid.includes(g)); const opts=shuffle(r,[ans,...shuffle(r,bad).slice(0,3)]);
      return {umido,chapa,ans,opts}; }
  },
  render(box,I,api){
    let cur=null;
    box.innerHTML=`<div class="situ"><span class="lbl">Serviço</span><h3>Chapa de ${I.chapa}</h3><p>Ambiente: <b>${I.umido?'úmido, perto do mar':'seco, dentro do galpão'}</b>.</p></div>
      <div class="split"><div class="bench"><svg id="ps" viewBox="0 0 240 130" role="img" aria-label="Chapa de ${I.chapa} com furos para parafusos"></svg></div>
      <div class="col"><p class="lbl">Parafuso</p><div class="grid2" id="pop"></div><button class="btn primary" id="aper" disabled>Apertar e esperar 1 ano</button></div></div>`;
    const svg=$('#ps'); svgEl('rect',{x:20,y:30,width:200,height:70,rx:4,fill:GCOL[I.chapa],stroke:'var(--ink)','stroke-width':1.5},svg);
    const tc=svgEl('text',{x:120,y:118,'text-anchor':'middle','font-size':11,'font-weight':700,fill:'var(--ink)'},svg); tc.textContent='Chapa de '+I.chapa;
    const bolts=svgEl('g',{},svg);
    function drawB(c,rust){ bolts.innerHTML=''; [50,120,190].forEach(x=>{ svgEl('circle',{cx:x,cy:65,r:11,fill:c||'var(--panel)',stroke:'var(--ink)','stroke-width':1.5},bolts); if(c){ svgEl('path',{d:`M${x-5} 65 h10 M${x} 60 v10`,stroke:'var(--ink)','stroke-width':1.5},bolts); } if(rust) svgEl('circle',{cx:x,cy:65,r:15,fill:'#8B3A1A','fill-opacity':.55},bolts); }); }
    drawB();
    choiceGroup($('#pop'),I.opts,g=>`<span><span class="sw" style="background:${GCOL[g]}"></span>${g}</span>`,g=>{ cur=g; drawB(GCOL[g]); $('#aper').disabled=api.done(); });
    $('#aper').onclick=()=>{
      if(!cur||api.done()) return;
      if(cur===I.ans){ api.win(); return; }
      drawB(GCOL[cur],true);
      api.wrong(I.umido?`Um ano depois, ${GALV.indexOf(cur)<GALV.indexOf(I.chapa)?'o parafuso':'a chapa em volta do parafuso'} corroeu. ${cur} e ${I.chapa} não combinam no ambiente úmido.`:`Não corroeu, mas no ambiente seco a regra pede o parafuso mais barato.`);
      setTimeout(()=>drawB(GCOL[cur]),1500);
    };
  },
  explica:I=>I.umido?`No ambiente úmido, ${I.chapa} combina com parafuso de <b>${I.ans}</b> (mesmo metal ou o vizinho na lista galvânica). Escolher metais compatíveis evita que estruturas soltem com o tempo.`:`Sem umidade não há corrosão galvânica, então vale o mais barato: <b>aço carbono</b>.`
});

/* --- 3E Cabo do guindaste --- */
const CABOS=[['Corda de nylon 12 mm',2500],['Corda de nylon 16 mm',4000],['Cabo de aço 6 mm',2000],['Cabo de aço 8 mm',3500],['Cabo de aço 10 mm',5500],['Cabo de aço 12 mm',8000],['Cabo de aço 16 mm',14000]];
GAMES.push({
  id:'cabo', setor:2, titulo:'Cabo do guindaste',
  lede:'O guindaste vai içar uma carga. Escolha o cabo: fraco demais arrebenta, forte demais sai caro e pesado.',
  manual:`<div class="tw"><table><thead><tr><th>Cabo</th><th>Rompe com</th></tr></thead><tbody>${CABOS.slice().sort((a,b)=>a[1]-b[1]).map(c=>`<tr><td>${c[0]}</td><td>${c[1].toLocaleString('pt-BR')} kg</td></tr>`).join('')}</tbody></table></div>
   <p><b>Fator de segurança:</b> o cabo precisa romper com uma carga bem maior que a real.</p>
   <ul><li>Içar <b>objetos</b>: carga × <b>5</b>.</li><li>Içar <b>pessoas</b>: carga × <b>10</b>.</li></ul>
   <p>O cabo serve se <b>“rompe com”</b> for maior ou igual ao resultado. Entre os que servem, escolha o que <b>rompe com o menor valor</b> (mais barato).</p>`,
  dica:'Multiplique a carga pelo fator (5 para objetos, 10 para pessoas). Depois procure na tabela o cabo mais fraco que ainda passa desse valor.',
  gen(r){
    for(;;){ const pessoas=r()<.4; const load=pessoas?pick(r,[150,200,240,320,400,480]):pick(r,[300,400,500,600,800,900,1000,1200,1500]);
      const need=load*(pessoas?10:5); const opts=shuffle(r,CABOS).slice(0,4); const ok=opts.filter(c=>c[1]>=need); if(!ok.length||ok.length===4) continue;
      const ans=ok.reduce((a,b)=>a[1]<=b[1]?a:b); return {pessoas,load,need,opts,ans:ans[0]}; }
  },
  render(box,I,api){
    let cur=null;
    box.innerHTML=`<div class="situ"><span class="lbl">Içamento</span><h3>${I.pessoas?`Plataforma com pessoas: ${I.load} kg`:`Carga de objetos: ${I.load} kg`}</h3></div>
      <div class="split"><div class="bench"><svg id="cs" viewBox="0 0 220 170" role="img" aria-label="Guindaste com a carga pendurada"></svg></div>
      <div class="col"><p class="lbl">Cabo</p><div class="grid2" id="cop"></div><button class="btn primary" id="ica" disabled>Içar</button></div></div>`;
    const svg=$('#cs');
    svgEl('rect',{x:30,y:20,width:10,height:140,fill:'var(--accent)',stroke:'var(--ink)'},svg); svgEl('rect',{x:20,y:20,width:170,height:9,fill:'var(--accent)',stroke:'var(--ink)'},svg);
    svgEl('rect',{x:10,y:156,width:50,height:8,fill:'var(--ink)'},svg);
    const rope=svgEl('line',{x1:160,y1:29,x2:160,y2:100,stroke:'var(--ink)','stroke-width':2},svg);
    const lg=svgEl('g',{},svg); svgEl('rect',{x:136,y:100,width:48,height:34,fill:'var(--ink)',rx:3},lg); const lt=svgEl('text',{x:160,y:121,'text-anchor':'middle','font-size':11,'font-weight':800,fill:'var(--bg)'},lg); lt.textContent=I.load+' kg';
    choiceGroup($('#cop'),I.opts,c=>c[0],c=>{ cur=c; $('#ica').disabled=api.done(); });
    $('#ica').onclick=()=>{
      if(!cur||api.done()) return;
      if(cur[1]<I.need){ animate(700,t=>{ lg.setAttribute('transform',`translate(0 ${t*30})`); rope.setAttribute('y2',100-t*40); },()=>{ api.wrong(`${cur[0]} rompe com ${cur[1].toLocaleString('pt-BR')} kg, menos que os ${I.need.toLocaleString('pt-BR')} kg exigidos pelo fator de segurança.`); setTimeout(()=>{ lg.setAttribute('transform',''); rope.setAttribute('y2',100); },900); }); return; }
      if(cur[0]!==I.ans){ api.wrong(`${cur[0]} aguenta, mas é mais forte (e mais caro) do que o necessário. Procure o mais fraco que ainda passa.`); return; }
      animate(1000,t=>{ lg.setAttribute('transform',`translate(0 ${-t*50})`); rope.setAttribute('y2',100-t*50); },()=>api.win());
    };
  },
  explica:I=>`${I.load} kg × ${I.pessoas?10:5} = ${I.need.toLocaleString('pt-BR')} kg: o mais econômico que passa é <b>${I.ans}</b>. Fator de segurança é regra em todo projeto de engenharia.`
});

boot();

})();
</script>
